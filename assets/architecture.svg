<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" fill="none" role="img" aria-labelledby="t d">
  <title id="t">From code to production</title>
  <desc id="d">Delivery pipeline: Code, CI, Container, Edge, Runtime, Data — looped by monitoring, backups and rollback.</desc>
  <style>
    :root{--bg:#021f1b;--panel:#062a25;--line:rgba(14,224,152,.22);--ink:#f9fafa;--dim:#8fb5aa;--acc:#0ee098}
    @media (prefers-color-scheme:light){
      :root{--bg:#f4fbf8;--panel:#ffffff;--line:rgba(10,106,71,.24);--ink:#06241d;--dim:#4a6b62;--acc:#0a7a52}
    }
    .bg{fill:var(--bg)}
    .node{fill:var(--panel);stroke:var(--line);stroke-width:1}
    .rail{stroke:var(--line);stroke-width:1.5}
    .loop{stroke:var(--acc);stroke-width:1.5;stroke-dasharray:4 7;opacity:.7;animation:dash 2.4s linear infinite}
    .pk{fill:var(--acc)}
    .idx{fill:var(--acc);font:600 11px ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1px}
    .ttl{fill:var(--ink);font:600 17px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .sub{fill:var(--dim);font:400 11px -apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif}
    .cap{fill:var(--dim);font:500 11px ui-monospace,'JetBrains Mono',SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2.5px}
    .capA{fill:var(--acc)}
    .live{fill:var(--acc);animation:blink 1.6s ease-in-out infinite}
    @keyframes dash{to{stroke-dashoffset:-22}}
    @keyframes blink{50%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){.loop,.live{animation:none}.pk{display:none}}
  </style>

  <rect class="bg" width="1000" height="260" rx="14"/>

  <text class="cap" x="40" y="48"><tspan class="capA">//</tspan> FROM CODE TO PRODUCTION</text>
  <circle class="live" cx="948" cy="44" r="4"/>
  <text class="cap" x="936" y="48" text-anchor="end">LIVE</text>

  <!-- rail + packets (drawn under the nodes so they surface in the gaps) -->
  <path class="rail" d="M104 124 H896"/>
  <g class="pk">
    <circle r="3.5"><animateMotion dur="4s" repeatCount="indefinite" path="M104 124 H896"/></circle>
    <circle r="3.5"><animateMotion dur="4s" begin="-1.33s" repeatCount="indefinite" path="M104 124 H896"/></circle>
    <circle r="3.5"><animateMotion dur="4s" begin="-2.66s" repeatCount="indefinite" path="M104 124 H896"/></circle>
  </g>

  <!-- feedback loop -->
  <path class="loop" d="M896 164 V196 Q896 210 882 210 H118 Q104 210 104 196 V170"/>
  <path d="M98 176 L104 166 L110 176" stroke="var(--acc)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  <text class="cap" x="500" y="236" text-anchor="middle">MONITOR · BACKUP · ROLLBACK · IMPROVE</text>

  <!-- nodes -->
  <g>
    <rect class="node" x="40" y="84" width="128" height="80" rx="10"/>
    <text class="idx" x="56" y="106">01</text>
    <text class="ttl" x="56" y="132">Code</text>
    <text class="sub" x="56" y="151">TypeScript · Node</text>
  </g>
  <g>
    <rect class="node" x="198" y="84" width="128" height="80" rx="10"/>
    <text class="idx" x="214" y="106">02</text>
    <text class="ttl" x="214" y="132">CI / CD</text>
    <text class="sub" x="214" y="151">GitHub Actions</text>
  </g>
  <g>
    <rect class="node" x="357" y="84" width="128" height="80" rx="10"/>
    <text class="idx" x="373" y="106">03</text>
    <text class="ttl" x="373" y="132">Container</text>
    <text class="sub" x="373" y="151">Docker · Compose</text>
  </g>
  <g>
    <rect class="node" x="515" y="84" width="128" height="80" rx="10"/>
    <text class="idx" x="531" y="106">04</text>
    <text class="ttl" x="531" y="132">Edge</text>
    <text class="sub" x="531" y="151">Cloudflare · Nginx</text>
  </g>
  <g>
    <rect class="node" x="674" y="84" width="128" height="80" rx="10"/>
    <text class="idx" x="690" y="106">05</text>
    <text class="ttl" x="690" y="132">Runtime</text>
    <text class="sub" x="690" y="151">Linux · VPS</text>
  </g>
  <g>
    <rect class="node" x="832" y="84" width="128" height="80" rx="10" style="stroke:var(--acc)"/>
    <text class="idx" x="848" y="106">06</text>
    <text class="ttl" x="848" y="132">Data</text>
    <text class="sub" x="848" y="151">Mongo · Postgres</text>
  </g>
</svg>
