<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">From Code to Production</title><desc id="desc">A visual engineering pipeline from architecture and development through deployment, security and maintenance.</desc>
<defs>
 <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4d98b"/><stop offset=".48" stop-color="#d4af37"/><stop offset="1" stop-color="#8c6415"/></linearGradient>
 <linearGradient id="line" x1="0" x2="1"><stop stop-color="#d4af37" stop-opacity=".15"/><stop offset=".5" stop-color="#e8c66b"/><stop offset="1" stop-color="#d4af37" stop-opacity=".15"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#d4af37" stop-opacity=".16"/><stop offset="1" stop-color="#d4af37" stop-opacity="0"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
 <style>
 .bg{fill:#0b0a07}.panel{fill:#12100b;stroke:#332b19}.ink{fill:#f4ecd6}.dim{fill:#a99f86}.gold{fill:url(#g)}.stroke{stroke:#4a3d20}.muted{stroke:#665a3d}
 .card{fill:#12100b;stroke:#3a311d}.num{fill:#0b0a07;stroke:#d4af37}.dot{fill:#d4af37}
 .pulse{animation:p 3s ease-in-out infinite}.flow{stroke-dasharray:7 10;animation:f 3.2s linear infinite}
 @keyframes p{0%,100%{opacity:.45}50%{opacity:1}} @keyframes f{to{stroke-dashoffset:-34}}
 @media(prefers-reduced-motion:reduce){.pulse,.flow{animation:none}}
 </style>
</defs>
<rect class="bg" width="1200" height="420"/>
<circle cx="600" cy="205" r="330" fill="url(#halo)" filter="url(#glow)"/>
<rect x="20" y="20" width="1160" height="380" rx="22" class="panel"/>
<path d="M72 116H1128" stroke="url(#line)" stroke-width="1"/>
<text x="72" y="68" class="gold" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="3">FULL LIFECYCLE ENGINEERING</text>
<text x="72" y="96" class="ink" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800">From Code to Production</text>
<text x="1128" y="94" text-anchor="end" class="dim" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">ARCHITECTURE · BUILD · SHIP · MAINTAIN</text>

<path d="M150 205H1050" stroke="#3b321e" stroke-width="2"/>
<path d="M150 205H1050" stroke="url(#line)" stroke-width="2" class="flow"/>

<g font-family="Inter,Segoe UI,Arial,sans-serif">
 <g transform="translate(120 145)">
  <circle cx="30" cy="60" r="29" class="num" stroke-width="1.5"/><text x="30" y="66" text-anchor="middle" class="gold" font-size="15" font-weight="800">01</text>
  <rect x="0" y="105" width="170" height="94" rx="13" class="card"/>
  <text x="18" y="132" class="ink" font-size="14" font-weight="800">ARCHITECT</text><text x="18" y="153" class="dim" font-size="11">Design · Model · Secure</text><text x="18" y="179" class="dim" font-size="11">Clear boundaries, ready to scale</text>
 </g>
 <g transform="translate(350 145)">
  <circle cx="30" cy="60" r="29" class="num" stroke-width="1.5"/><text x="30" y="66" text-anchor="middle" class="gold" font-size="15" font-weight="800">02</text>
  <rect x="0" y="105" width="170" height="94" rx="13" class="card"/>
  <text x="18" y="132" class="ink" font-size="14" font-weight="800">BUILD</text><text x="18" y="153" class="dim" font-size="11">Backend · Frontend · API</text><text x="18" y="179" class="dim" font-size="11">Modular, tested, maintainable</text>
 </g>
 <g transform="translate(580 145)">
  <circle cx="30" cy="60" r="29" class="num" stroke-width="1.5"/><text x="30" y="66" text-anchor="middle" class="gold" font-size="15" font-weight="800">03</text>
  <rect x="0" y="105" width="170" height="94" rx="13" class="card"/>
  <text x="18" y="132" class="ink" font-size="14" font-weight="800">SHIP</text><text x="18" y="153" class="dim" font-size="11">Linux · VPS · CI/CD</text><text x="18" y="179" class="dim" font-size="11">Reliable releases, controlled deploys</text>
 </g>
 <g transform="translate(810 145)">
  <circle cx="30" cy="60" r="29" class="num" stroke-width="1.5"/><text x="30" y="66" text-anchor="middle" class="gold" font-size="15" font-weight="800">04</text>
  <rect x="0" y="105" width="170" height="94" rx="13" class="card"/>
  <text x="18" y="132" class="ink" font-size="14" font-weight="800">MAINTAIN</text><text x="18" y="153" class="dim" font-size="11">Monitor · Optimize · Improve</text><text x="18" y="179" class="dim" font-size="11">Performance and long-term stability</text>
 </g>
</g>
<g class="pulse"><circle cx="150" cy="205" r="4" class="dot"/><circle cx="380" cy="205" r="4" class="dot"/><circle cx="610" cy="205" r="4" class="dot"/><circle cx="840" cy="205" r="4" class="dot"/><circle cx="1050" cy="205" r="4" class="dot"/></g>
<text x="600" y="374" text-anchor="middle" class="dim" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">CUSTOM WEB PLATFORMS · SAAS · BUSINESS SYSTEMS · DEVOPS</text>
</svg>