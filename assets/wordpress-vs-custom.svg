<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none" font-family="'Segoe UI','Vazirmatn','Tahoma',Arial,sans-serif">
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4dda0"/><stop offset=".5" stop-color="#e3bd5c"/><stop offset="1" stop-color="#a97d1d"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#e8c66b" stop-opacity=".13"/><stop offset="1" stop-color="#e8c66b" stop-opacity="0"/></radialGradient>
  <style>
    :root{--bg:#0b0a07;--panel:#15120b;--ink:#f4ecd6;--dim:#a99f86;--gold:#e8c66b;--mut:#665e4d;--line:#3a331d}
    @media(prefers-color-scheme:light){:root{--bg:#fbf5e6;--panel:#fffdf5;--ink:#231c09;--dim:#6a5f42;--gold:#9a6f16;--mut:#aaa083;--line:#d8c48c}}
    .bg{fill:var(--bg)}.panel{fill:var(--panel)}.ink{fill:var(--ink)}.dim{fill:var(--dim)}.goldf{fill:var(--gold)}
    .line{stroke:var(--line);stroke-width:1}.box{fill:var(--panel);stroke:var(--line);stroke-width:1.4}
    .accent{fill:var(--gold)}.barbg{fill:var(--line);opacity:.42}
    .bar{transform-origin:left;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) forwards}.custom{fill:var(--gold)}.wpbar{fill:var(--mut)}
    .badge{fill:var(--panel);stroke:var(--gold);stroke-width:1.5}
    .en{animation:en 10s ease-in-out infinite}.fa{animation:fa 10s ease-in-out infinite}
    .pulse{animation:pulse 2.8s ease-in-out infinite}.float{animation:float 3.4s ease-in-out infinite}
    @keyframes en{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
    @keyframes fa{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(var(--s))}}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.fa{opacity:0}.bar{transform:scaleX(var(--s))}}
  </style>
</defs>
<rect class="bg" width="1200" height="360"/>
<ellipse cx="600" cy="170" rx="680" ry="220" fill="url(#glow)"/>
<rect x="1" y="1" width="1198" height="358" rx="10" fill="none" stroke="var(--line)"/>

<text class="goldf en" x="48" y="46" font-size="15" font-weight="800" letter-spacing="2">WHY NOT WORDPRESS?</text>
<text class="goldf fa" x="48" y="46" font-size="17" font-weight="800">چرا وردپرس نه؟</text>
<text class="dim en" x="48" y="72" font-size="12">Not every website needs custom development. Product complexity changes the answer.</text>
<text class="dim fa" x="48" y="72" font-size="13">هر وب‌سایتی به توسعه اختصاصی نیاز ندارد؛ پیچیدگی محصول است که انتخاب را مشخص می‌کند.</text>

<g transform="translate(48 108)">
  <rect class="box" width="470" height="204" rx="12"/>
  <text class="ink" x="28" y="34" font-size="16" font-weight="800">WORDPRESS</text>
  <text class="dim" x="28" y="55" font-size="11">Great for content-driven websites</text>
  <text class="dim fa" x="442" y="55" text-anchor="end" font-size="11">مناسب برای سایت‌های محتوامحور</text>
  <g class="float">
    <rect x="28" y="82" width="92" height="46" rx="9" fill="none" stroke="var(--mut)" stroke-width="1.5"/>
    <text x="74" y="111" text-anchor="middle" fill="var(--mut)" font-size="17" font-weight="800">WP</text>
  </g>
  <g class="pulse">
    <circle cx="170" cy="105" r="4" class="wpbar"/><circle cx="190" cy="105" r="4" class="wpbar"/><circle cx="210" cy="105" r="4" class="wpbar"/>
  </g>
  <text class="dim" x="28" y="160" font-size="12">Themes · Plugins · CMS workflow</text>
  <text class="dim fa" x="28" y="184" font-size="12">قالب · افزونه · مدیریت محتوا</text>
</g>

<g transform="translate(542 108)">
  <rect class="box" width="610" height="204" rx="12"/>
  <text class="goldf" x="28" y="34" font-size="16" font-weight="800">CUSTOM APPLICATION</text>
  <text class="dim" x="28" y="55" font-size="11">Better fit for complex business products</text>
  <text class="dim fa" x="582" y="55" text-anchor="end" font-size="11">مناسب‌تر برای محصولات با منطق پیچیده</text>

  <g transform="translate(28 78)">
    <text class="dim" x="0" y="10" font-size="11">Business logic</text><text class="dim fa" x="168" y="10" text-anchor="end" font-size="11">منطق کسب‌وکار</text>
    <rect class="barbg" y="18" width="360" height="7" rx="4"/><rect class="bar custom" y="18" width="360" height="7" rx="4" style="--s:.96"/>
    <text class="dim" x="0" y="52" font-size="11">Architecture control</text><text class="dim fa" x="168" y="52" text-anchor="end" font-size="11">کنترل معماری</text>
    <rect class="barbg" y="60" width="360" height="7" rx="4"/><rect class="bar custom" y="60" width="360" height="7" rx="4" style="--s:.98"/>
    <text class="dim" x="0" y="94" font-size="11">Integrations</text><text class="dim fa" x="168" y="94" text-anchor="end" font-size="11">یکپارچه‌سازی</text>
    <rect class="barbg" y="102" width="360" height="7" rx="4"/><rect class="bar custom" y="102" width="360" height="7" rx="4" style="--s:.95"/>
    <text class="dim" x="0" y="136" font-size="11">Long-term maintenance</text><text class="dim fa" x="168" y="136" text-anchor="end" font-size="11">نگهداری بلندمدت</text>
    <rect class="barbg" y="144" width="360" height="7" rx="4"/><rect class="bar custom" y="144" width="360" height="7" rx="4" style="--s:.97"/>
  </g>
  <g transform="translate(426 78)">
    <rect class="badge" width="150" height="122" rx="10"/>
    <text class="goldf" x="75" y="30" text-anchor="middle" font-size="11" font-weight="800">BUILT AROUND</text>
    <text class="ink" x="75" y="57" text-anchor="middle" font-size="15" font-weight="800">YOUR PRODUCT</text>
    <text class="dim fa" x="75" y="82" text-anchor="middle" font-size="12">نیاز واقعی محصول</text>
    <text class="goldf" x="75" y="105" text-anchor="middle" font-size="10">LOGIC · DATA · API</text>
  </g>
</g>

<text class="dim en" x="48" y="340" font-size="11">Use WordPress when it fits. Choose custom development when the product demands control.</text>
<text class="dim fa" x="1152" y="340" text-anchor="end" font-size="11">وقتی وردپرس کافی است، از آن استفاده کنید؛ وقتی محصول کنترل می‌خواهد، اختصاصی توسعه دهید.</text>
</svg>